<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Sakthi Narendran</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 360px;
            background: white;
            padding: 35px;

            border-radius: 14px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.12);
        }

        .login-box h2 {
            text-align: center;
            color: #111827;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            color: #374151;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #cbd5e1;
            border-radius: 7px;

            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #0284c7;
        }

        button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 7px;

            background: #0284c7;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #0369a1;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;

            padding: 10px;
            border-radius: 7px;

            text-align: center;
            margin-bottom: 18px;

            font-size: 14px;
        }

        .security {
            text-align: center;
            margin-top: 20px;

            color: #64748b;
            font-size: 13px;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #0284c7;
            text-decoration: none;
        }

        .back a:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h2>Admin Login</h2>

        <p class="subtitle">
            Portfolio Administration Panel
        </p>

        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}

        <form method="POST">

            <div class="input-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="input-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button type="submit">
                Login
            </button>

        </form>


        <div class="security">
            🔒 Secure Admin Login
        </div>


        <div class="back">

            <a href="/">
                ← Back to Portfolio
            </a>

        </div>

    </div>

</body>

</html>
